<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="theme-color" content="#f6f4f1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Timer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23f6f4f1%22/><circle cx=%2250%22 cy=%2254%22 r=%2228%22 fill=%22none%22 stroke=%22%237b7b7b%22 stroke-width=%228%22/><path d=%22M45 20 h10 M50 20 v10%22 stroke=%22%237b7b7b%22 stroke-width=%227%22 stroke-linecap=%22round%22/><path d=%22M44 46 l14 8-14 8z%22 fill=%22%23ecab0f%22/></svg>">

<link rel="stylesheet" href="../shared/style.css">
<script src="../shared/heartbeat.js" defer></script>
<style>
  :root {
    --main-width: 640px;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--ink);
    text-decoration: none;
    margin-bottom: 16px;
  }

  .title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2px;
  }

  h1 { margin: 0; }

  .icon-btn {
    background: var(--card);
    width: 40px;
    height: 40px;
    border-radius: 12px;
    border: var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: var(--ink);
  }

  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }

  .icon-btn svg { width: 18px; height: 18px; }

  .header-icons { display: flex; gap: 8px; }

  .icon-btn.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

  .today-total { font-size: 13px; margin: 4px 0 24px; }

  .today-total strong { font-weight: 500; }

  .running-card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 18px;
    border-radius: 20px;
    background: var(--accent);
    color: var(--on-accent);
    margin-bottom: 16px;
  }

  .running-card.empty {
    background: var(--card);
    color: var(--ink);
    border: var(--border);
    font-size: 13px;
    justify-content: center;
    padding: 18px;
  }

  .running-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--on-accent);
    flex-shrink: 0;
    animation: pulse 1.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .running-info { flex: 1; min-width: 0; }

  .running-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.85; margin: 0 0 3px; }

  .running-name { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .running-time {
    font-variant-numeric: tabular-nums;
    font-size: 20px;
    font-weight: 500;
    flex-shrink: 0;
  }

  .stop-btn {
    width: 36px;
    height: 36px;
    border-radius: 12px;
    border: none;
    background: #fff;
    color: var(--on-accent);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }

  .stop-btn svg { width: 13px; height: 13px; }

  .input-wrap { position: relative; margin-bottom: 28px; }

  .input-row {
    background: var(--card);
    display: flex;
    gap: 10px;
    align-items: center;
    border: var(--border);
    border-radius: 16px;
    padding: 6px 6px 6px 16px;
  }

  .input-row:focus-within { border-color: var(--accent); }

  .input-row input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    font-size: 15px;
    font-family: inherit;
    color: var(--ink);
    padding: 10px 0;
  }

  .input-row input::placeholder { color: var(--ink); opacity: 0.7; }

  .start-btn {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: var(--on-accent);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }

  .start-btn:disabled { opacity: 0.4; cursor: default; }

  .start-btn svg { width: 14px; height: 14px; }

  .suggestions {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: var(--card);
    border: var(--border);
    border-radius: 16px;
    overflow: hidden;
    z-index: 5;
    display: none;
  }

  .suggestions.open { display: block; }

  .suggestion {
    padding: 11px 16px;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .suggestion:hover, .suggestion.active { background: var(--bg); }

  .suggestion + .suggestion { border-top: var(--border); }

  .suggestion .s-time { font-size: 12px; font-weight: 500; flex-shrink: 0; }

  .suggestion.create { color: var(--accent); font-weight: 500; }

  .section-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 0 0 10px 4px;
  }

  .project-list { display: flex; flex-direction: column; gap: 10px; }

  .row {
    background: var(--card);
    display: flex;
    align-items: center;
    gap: 14px;
    border: var(--border);
    border-radius: 16px;
    padding: 12px 14px;
  }

  .row.running { border-color: var(--accent); }

  .play-btn {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    border: var(--border);
    background: var(--card);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    color: var(--ink);
  }

  .play-btn:hover { border-color: var(--accent); color: var(--accent); }

  .play-btn svg { width: 12px; height: 12px; }

  .row.running .play-btn { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

  .row .name {
    color: var(--strong);
    flex: 1;
    min-width: 0;
    font-size: 15px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .row .today-time {
    font-size: 13px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
    min-width: 44px;
    text-align: right;
  }

  .row.running .today-time { color: var(--accent); font-weight: 500; }

  .row .date {
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    flex-shrink: 0;
  }

  .row .date svg { width: 15px; height: 15px; }

  .row.editable { cursor: pointer; }

  .row.editable:hover { border-color: var(--accent); }

  .row.editing { flex-direction: column; align-items: stretch; cursor: default; }

  .edit-form { display: flex; flex-direction: column; gap: 10px; width: 100%; }

  .edit-name {
    border: var(--border);
    border-radius: 10px;
    padding: 9px 10px;
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    color: var(--ink);
    background: var(--bg);
  }

  .edit-time-row { display: flex; gap: 10px; }

  .edit-time-row label {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .edit-time-row input[type="time"] {
    border: var(--border);
    border-radius: 10px;
    padding: 7px 8px;
    font-size: 14px;
    font-family: inherit;
    color: var(--ink);
    background: var(--bg);
  }

  .edit-time-row input:disabled { opacity: 0.5; }

  .edit-or { font-size: 11px; opacity: 0.6; text-align: center; }

  .edit-duration-wrap {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .edit-duration-wrap input {
    border: var(--border);
    border-radius: 10px;
    padding: 7px 8px;
    font-size: 14px;
    font-family: inherit;
    text-transform: none;
    letter-spacing: normal;
    color: var(--ink);
    background: var(--bg);
  }

  .edit-hint { font-size: 11px; margin: 0; opacity: 0.7; }

  .edit-actions { display: flex; gap: 8px; justify-content: flex-end; }

  .edit-actions button {
    border: none;
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
  }

  .edit-save { background: var(--accent); color: var(--on-accent); }

  .edit-cancel { background: var(--card); border: var(--border); color: var(--ink); }

  .edit-delete {
    background: none;
    border: 1px solid var(--danger);
    color: var(--danger);
    margin-right: auto;
  }

  .edit-delete:disabled { opacity: 0.4; border-color: var(--faint); color: var(--faint); cursor: not-allowed; }

  .empty-list { text-align: center; font-size: 13px; padding: 30px 0; }

  .day-log-section { margin-top: 28px; }

  .log-list {
    background: var(--card);
    border: var(--border);
    border-radius: 16px;
    padding: 4px 14px;
  }

  .log-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    font-size: 13px;
  }

  .log-row + .log-row { border-top: var(--border); }

  .log-row.open .log-inout { color: var(--accent); font-weight: 500; }

  .log-name {
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--strong);
    font-weight: 500;
  }

  .log-inout { font-variant-numeric: tabular-nums; flex-shrink: 0; }

  .log-dur {
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
    min-width: 48px;
    text-align: right;
    color: var(--strong);
    font-weight: 500;
  }

  .row .today-time, .today-total strong { color: var(--strong); }
</style>
</head>
<body>
<main>
  <a class="back-link" href="/">← Accueil</a>

  <div class="title-row">
    <h1>Timer</h1>
    <div class="header-icons">
      <button class="icon-btn" id="editModeBtn" type="button" title="Éditer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/>
        </svg>
      </button>
      <a class="icon-btn" href="/report" title="Report">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M5 19V11 M12 19V5 M19 19v-7"/>
        </svg>
      </a>
    </div>
  </div>
  <p class="today-total">Aujourd'hui : <strong id="todayTotal">0m</strong></p>

  <div id="runningCard"></div>

  <div class="input-wrap">
    <div class="input-row">
      <input type="text" id="projectInput" placeholder="Sur quoi travailles-tu ?" autocomplete="off">
      <button class="start-btn" id="startBtn" disabled title="Démarrer">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg>
      </button>
    </div>
    <div class="suggestions" id="suggestions"></div>
  </div>

  <p class="section-label">Projets</p>
  <div class="project-list" id="projectList"></div>

  <div class="day-log-section" id="dayLogSection"></div>
</main>

<script>
  // --- État (chargé depuis le backend : Timer/timer_store.py + Timer/timer.db) ---
  // `history` garde le temps par jour travaillé : [{date, minutes}, ...] trié du plus ancien au plus récent.
  // La ligne du projet n'affiche QUE la dernière entrée (dernier jour travaillé) ; le total (tri "plus utilisé")
  // additionne tout l'historique.
  let projects = [];
  let runningId = null;    // id (number) du projet en cours, ou null
  let runningSince = null; // équivalent Date.now() du started_at renvoyé par le serveur
  let activeSuggestionIndex = -1;
  let editMode = false;    // bascule via le crayon dans l'en-tête
  let editingId = null;    // id du projet dont la bulle est ouverte en édition, ou null
  let dayLog = [];         // journal in/out du jour (chargé uniquement en mode édition)

  // Date locale (jour civil), pas new Date().toISOString() : celle-ci est en UTC, donc fausse
  // pendant 1-2h après minuit en heure d'été/hiver (le serveur, lui, raisonne en date locale).
  const todayISO = () => {
    const d = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  };

  function fmt(mins) {
    mins = Math.round(mins);
    if (mins <= 0) return '-';
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    if (h > 0) return `${h}h ${m}m`;
    return `${m}m`;
  }

  function fmtClock(mins) {
    const totalSeconds = Math.round(mins * 60);
    const h = Math.floor(totalSeconds / 3600);
    const m = Math.floor((totalSeconds % 3600) / 60);
    const s = totalSeconds % 60;
    const pad = (n) => String(n).padStart(2, '0');
    return `${pad(h)}:${pad(m)}:${pad(s)}`;
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    const [y, m, d] = iso.split('-').map(Number);
    return `${d}/${m}`;
  }

  function fmtHHMM(d) {
    return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  }

  // Durée -> heures décimales (accepte 1:30, 1h30, 1h, 2.5, "2,5") — même règle que dans Import TimeSheet.
  function parseDurationHours(s) {
    s = (s || '').trim();
    if (!s) return null;
    let match;
    if ((match = s.match(/^(\d+):(\d{2})$/))) return +match[1] + +match[2] / 60;
    if ((match = s.match(/^(\d+)\s*h\s*(\d{1,2})?$/i))) return +match[1] + +(match[2] || 0) / 60;
    if (/^\d+([.,]\d+)?$/.test(s)) return parseFloat(s.replace(',', '.'));
    return null;
  }

  function lastEntry(p) {
    return p.history.length ? p.history[p.history.length - 1] : null;
  }

  // Minutes à afficher sur la ligne : celles du DERNIER jour travaillé uniquement
  // (+ le direct en cours si ce projet tourne).
  function rowMinutes(p) {
    if (p.id === runningId) {
      // En cours : la base doit être l'entrée d'AUJOURD'HUI si elle existe (une reprise plus tard
      // dans la journée), jamais la dernière entrée de l'historique si celle-ci date d'un jour
      // précédent — sinon l'affichage repart du minutage d'un ancien jour au lieu de 0.
      const todayEntry = p.history.find((h) => h.date === todayISO());
      const base = todayEntry ? todayEntry.minutes : 0;
      return base + (Date.now() - runningSince) / 60000;
    }
    const entry = lastEntry(p);
    return entry ? entry.minutes : 0;
  }

  function rowDate(p) {
    // En cours -> toujours "aujourd'hui", même si la dernière entrée de l'historique est plus ancienne.
    if (p.id === runningId) return todayISO();
    const entry = lastEntry(p);
    return entry ? entry.date : null;
  }

  function totalMinutes(p) {
    const base = p.history.reduce((sum, h) => sum + h.minutes, 0);
    return p.id === runningId ? base + (Date.now() - runningSince) / 60000 : base;
  }

  function totalTodayAll() {
    const today = todayISO();
    return projects.reduce((sum, p) => {
      const entry = p.history.find((h) => h.date === today);
      let mins = entry ? entry.minutes : 0;
      if (p.id === runningId) mins += (Date.now() - runningSince) / 60000;
      return sum + mins;
    }, 0);
  }

  function sortedProjects() {
    return [...projects].sort((a, b) => {
      const da = rowDate(a) || '';
      const db = rowDate(b) || '';
      if (da !== db) return da < db ? 1 : -1;
      return totalMinutes(b) - totalMinutes(a);
    });
  }

  function applyState(state) {
    projects = state.projects;
    if (state.running) {
      runningId = state.running.projectId;
      runningSince = state.running.startedAt * 1000;
    } else {
      runningId = null;
      runningSince = null;
    }
  }

  async function loadState() {
    const res = await fetch('/api/timer/state', { cache: 'no-store' });
    applyState(await res.json());
    render();
  }

  async function startProject(name) {
    name = name.trim();
    if (!name) return;

    projectInput.value = '';
    closeSuggestions();

    const res = await fetch('/api/timer/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name }),
    });
    applyState(await res.json());
    render();
    refreshDayLog();
  }

  async function stopRunning() {
    const res = await fetch('/api/timer/stop', { method: 'POST' });
    applyState(await res.json());
    render();
    refreshDayLog();
  }

  function toggleProject(id) {
    if (runningId === id) {
      stopRunning();
    } else {
      const p = projects.find((x) => x.id === id);
      if (p) startProject(p.name);
    }
  }

  // --- Rendu ---
  const runningCardEl = document.getElementById('runningCard');
  const projectListEl = document.getElementById('projectList');
  const todayTotalEl = document.getElementById('todayTotal');
  const projectInput = document.getElementById('projectInput');
  const startBtn = document.getElementById('startBtn');
  const suggestionsEl = document.getElementById('suggestions');
  const editModeBtn = document.getElementById('editModeBtn');
  const dayLogSectionEl = document.getElementById('dayLogSection');

  function render() {
    todayTotalEl.textContent = fmt(totalTodayAll());

    if (runningId != null) {
      const p = projects.find((x) => x.id === runningId);
      const mins = rowMinutes(p);
      runningCardEl.innerHTML = `
        <div class="running-card">
          <span class="running-dot"></span>
          <div class="running-info">
            <p class="running-label">En cours</p>
            <p class="running-name">${escapeHtml(p.name)}</p>
          </div>
          <div class="running-time">${fmtClock(mins)}</div>
          <button class="stop-btn" id="stopBtn" title="Arrêter">
            <svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
          </button>
        </div>`;
      document.getElementById('stopBtn').addEventListener('click', stopRunning);
    } else {
      runningCardEl.innerHTML = `<div class="running-card empty">Aucun chronométrage en cours</div>`;
    }

    const list = sortedProjects();
    if (list.length === 0) {
      projectListEl.innerHTML = `<p class="empty-list">Aucun projet pour l'instant.</p>`;
      return;
    }

    projectListEl.innerHTML = list.map((p) => {
      const isRunning = p.id === runningId;
      if (editingId === p.id) return renderEditRow(p, isRunning);
      const icon = isRunning
        ? `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>`
        : `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg>`;
      return `
        <div class="row ${isRunning ? 'running' : ''} ${editMode ? 'editable' : ''}" data-id="${p.id}">
          <button class="play-btn" title="${isRunning ? 'Arrêter' : 'Démarrer'}">${icon}</button>
          <span class="name">${escapeHtml(p.name)}</span>
          <span class="today-time">${fmt(rowMinutes(p))}</span>
          <span class="date">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="5" width="18" height="16" rx="3"/>
              <path d="M3 9h18 M8 3v4 M16 3v4"/>
            </svg>
            ${fmtDate(rowDate(p))}
          </span>
        </div>`;
    }).join('');

    projectListEl.querySelectorAll('.row').forEach((row) => {
      const id = Number(row.dataset.id);
      if (editingId === id) {
        row.querySelector('.edit-cancel').addEventListener('click', () => { editingId = null; render(); });
        row.querySelector('.edit-save').addEventListener('click', () => saveEdit(id));
        row.querySelector('.edit-delete').addEventListener('click', () => deleteEdit(id));
        return;
      }
      row.querySelector('.play-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        toggleProject(id);
      });
      if (editMode) {
        row.addEventListener('click', () => { editingId = id; render(); });
      }
    });

    renderDayLog(); // ré-affiche depuis les données déjà chargées (fait vivre "en cours" sans re-fetch)
  }

  // Ligne "bulle" en mode édition : nom + plage début/fin (HH:MM) qui remplace la durée du jour.
  // Pour le projet en cours, Début est figé (l'heure de démarrage réelle) et seule Fin est éditable ;
  // enregistrer arrête le chronométrage à cette heure-là plutôt qu'à "maintenant".
  function renderEditRow(p, isRunning) {
    const entry = lastEntry(p);
    // Le début n'est connu à coup sûr que pour le projet en cours (running_state) ; pour un projet déjà
    // arrêté, on ne l'a que si un précédent stop/edit l'a enregistré (first_start_at) — sinon on ne l'a pas.
    const knownStart = isRunning
      ? new Date(runningSince)
      : (entry && entry.startedAt ? new Date(entry.startedAt * 1000) : null);
    const hint = isRunning
      ? `En cours depuis ${fmtHHMM(knownStart)} — corrigez Début si ce n'est pas la vraie heure, laissez Fin vide pour ne pas arrêter`
      : entry
        ? knownStart
          ? `Actuellement ${fmt(entry.minutes)} le ${fmtDate(entry.date)}, débuté à ${fmtHHMM(knownStart)}`
          : `Actuellement ${fmt(entry.minutes)} le ${fmtDate(entry.date)} — heure de début inconnue`
        : 'Aucune durée enregistrée pour l\'instant';
    const startVal = knownStart ? fmtHHMM(knownStart) : '';
    const endVal = ''; // toujours vide par défaut : pour le projet en cours, le remplir = l'arrêter
    return `
      <div class="row editing" data-id="${p.id}">
        <div class="edit-form">
          <input class="edit-name" type="text" value="${escapeHtml(p.name)}">
          <div class="edit-time-row">
            <label>Début
              <input class="edit-start" type="time" value="${startVal}" data-original="${startVal}">
            </label>
            <label>Fin
              <input class="edit-end" type="time" value="${endVal}">
            </label>
          </div>
          <p class="edit-or">— ou, si l'heure de début est inconnue —</p>
          <label class="edit-duration-wrap">Durée totale de ce jour
            <input class="edit-duration" type="text" placeholder="ex. 1h30, 1:30, 2.5">
          </label>
          <p class="edit-hint">${escapeHtml(hint)}</p>
          <div class="edit-actions">
            <button class="edit-delete" type="button" ${isRunning || !entry ? 'disabled' : ''} title="${isRunning ? 'Arrêtez le chrono avant de supprimer' : ''}">Supprimer</button>
            <button class="edit-cancel" type="button">Annuler</button>
            <button class="edit-save" type="button">Enregistrer</button>
          </div>
        </div>
      </div>`;
  }

  // --- Journal du jour (in/out), visible seulement en mode édition ---
  async function refreshDayLog() {
    if (!editMode) return;
    const res = await fetch('/api/timer/log', { cache: 'no-store' });
    dayLog = await res.json();
    renderDayLog();
  }

  function renderDayLog() {
    if (!editMode) { dayLogSectionEl.innerHTML = ''; return; }

    const rows = dayLog.map((s) => {
      const inTxt = fmtHHMM(new Date(s.startAt * 1000));
      const open = !s.endAt;
      const outTxt = open ? 'en cours' : fmtHHMM(new Date(s.endAt * 1000));
      const durMin = open ? (Date.now() / 1000 - s.startAt) / 60 : (s.endAt - s.startAt) / 60;
      return `
        <div class="log-row ${open ? 'open' : ''}">
          <span class="log-name">${escapeHtml(s.projectName)}</span>
          <span class="log-inout">${inTxt} → ${outTxt}</span>
          <span class="log-dur">${fmt(durMin)}</span>
        </div>`;
    }).join('');

    dayLogSectionEl.innerHTML = `
      <p class="section-label">Journal du jour</p>
      ${dayLog.length ? `<div class="log-list">${rows}</div>` : `<p class="empty-list">Aucun pointage aujourd'hui.</p>`}`;
  }

  async function saveEdit(id) {
    let p = projects.find((x) => x.id === id);
    const row = projectListEl.querySelector(`.row[data-id="${id}"]`);
    if (!p || !row) { editingId = null; render(); return; }

    const newName = row.querySelector('.edit-name').value.trim();
    if (newName && newName !== p.name) {
      const res = await fetch('/api/timer/rename', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, name: newName }),
      });
      const data = await res.json();
      if (data.error) { alert(data.error); return; }
      applyState(data);
      p = projects.find((x) => x.id === id) || p;
    }

    const durationVal = row.querySelector('.edit-duration').value.trim();
    const isRunning = id === runningId;

    if (durationVal) {
      // Durée directe : ne demande pas l'heure de début, on remplace juste le total du jour
      // (et, si le projet tourne encore, ça l'arrête aussi).
      const hours = parseDurationHours(durationVal);
      if (hours === null) { alert('Durée invalide (attendu 1h30, 1:30 ou 2.5)'); return; }
      const day = isRunning ? todayISO() : (rowDate(p) || todayISO());
      const res = await fetch('/api/timer/set-minutes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, date: day, minutes: hours * 60 }),
      });
      const data = await res.json();
      if (data.error) { alert(data.error); return; }
      applyState(data);
    } else {
      const endVal = row.querySelector('.edit-end').value;
      if (isRunning) {
        const startInput = row.querySelector('.edit-start');
        const startVal = startInput.value;
        if (startVal && startVal !== startInput.dataset.original) {
          // Redéfinit le début du chrono en cours (sans l'arrêter) — pour une reprise démarrée
          // en retard dans l'app par rapport à l'heure réelle.
          const res = await fetch('/api/timer/set-start', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ start: startVal }),
          });
          const data = await res.json();
          if (data.error) { alert(data.error); return; }
          applyState(data);
        }
        if (endVal) {
          const res = await fetch('/api/timer/stop-at', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ end: endVal }),
          });
          const data = await res.json();
          if (data.error) { alert(data.error); return; }
          applyState(data);
        }
      } else {
        const startVal = row.querySelector('.edit-start').value;
        if (startVal && endVal) {
          const day = rowDate(p) || todayISO();
          const res = await fetch('/api/timer/set-duration', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, date: day, start: startVal, end: endVal }),
          });
          const data = await res.json();
          if (data.error) { alert(data.error); return; }
          applyState(data);
        }
      }
    }

    editingId = null;
    render();
    refreshDayLog();
  }

  async function deleteEdit(id) {
    if (!confirm('Supprimer définitivement ces heures ?')) return;
    const p = projects.find((x) => x.id === id);
    if (!p) { editingId = null; render(); return; }
    const isRunning = id === runningId;
    const day = isRunning ? todayISO() : (rowDate(p) || todayISO());
    const res = await fetch('/api/timer/delete-entry', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, date: day }),
    });
    const data = await res.json();
    if (data.error) { alert(data.error); return; }
    applyState(data);
    editingId = null;
    render();
    refreshDayLog();
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // --- Saisie + autocomplétion ---
  function closeSuggestions() {
    suggestionsEl.classList.remove('open');
    suggestionsEl.innerHTML = '';
    activeSuggestionIndex = -1;
  }

  function updateSuggestions() {
    const q = projectInput.value.trim().toLowerCase();
    startBtn.disabled = q.length === 0;

    if (!q) { closeSuggestions(); return; }

    const matches = projects.filter((p) => p.name.toLowerCase().includes(q)).slice(0, 5);
    const exact = projects.some((p) => p.name.toLowerCase() === q);

    let html = matches.map((p) => `
      <div class="suggestion" data-name="${escapeHtml(p.name)}">
        <span>${escapeHtml(p.name)}</span>
        <span class="s-time">${fmt(totalMinutes(p))}</span>
      </div>`).join('');

    if (!exact) {
      html += `<div class="suggestion create" data-name="${escapeHtml(projectInput.value.trim())}">+ Créer « ${escapeHtml(projectInput.value.trim())} »</div>`;
    }

    suggestionsEl.innerHTML = html;
    suggestionsEl.classList.add('open');
    activeSuggestionIndex = -1;

    suggestionsEl.querySelectorAll('.suggestion').forEach((el) => {
      el.addEventListener('click', () => startProject(el.dataset.name));
    });
  }

  projectInput.addEventListener('input', updateSuggestions);
  projectInput.addEventListener('focus', updateSuggestions);
  projectInput.addEventListener('keydown', (e) => {
    const items = Array.from(suggestionsEl.querySelectorAll('.suggestion'));
    if (e.key === 'ArrowDown' && items.length) {
      e.preventDefault();
      activeSuggestionIndex = Math.min(activeSuggestionIndex + 1, items.length - 1);
      items.forEach((el, i) => el.classList.toggle('active', i === activeSuggestionIndex));
    } else if (e.key === 'ArrowUp' && items.length) {
      e.preventDefault();
      activeSuggestionIndex = Math.max(activeSuggestionIndex - 1, 0);
      items.forEach((el, i) => el.classList.toggle('active', i === activeSuggestionIndex));
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (activeSuggestionIndex >= 0 && items[activeSuggestionIndex]) {
        startProject(items[activeSuggestionIndex].dataset.name);
      } else if (projectInput.value.trim()) {
        startProject(projectInput.value.trim());
      }
    } else if (e.key === 'Escape') {
      closeSuggestions();
    }
  });

  startBtn.addEventListener('click', () => {
    if (projectInput.value.trim()) startProject(projectInput.value.trim());
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.input-wrap')) closeSuggestions();
  });

  editModeBtn.addEventListener('click', () => {
    editMode = !editMode;
    editingId = null;
    editModeBtn.classList.toggle('active', editMode);
    render();
    if (editMode) refreshDayLog();
  });

  loadState();
  // Au retour sur l'onglet (après mise en arrière-plan, veille...), on resynchronise avec le serveur :
  // si le heartbeat a entre-temps arrêté le chrono (vraie déconnexion), l'affichage doit le refléter
  // plutôt que de continuer à compter dans le vide côté client. Jamais pendant qu'une bulle d'édition
  // est ouverte (editingId !== null) : ça remplacerait la saisie en cours par l'état serveur, comme
  // le tick d'1s plus bas l'évite déjà pour la même raison.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && editingId === null) loadState();
  });
  setInterval(() => { if (editMode) refreshDayLog(); }, 5000);
  setInterval(() => {
    // Pendant qu'une bulle est ouverte en édition, on ne reconstruit pas toute la liste (la saisie
    // en cours serait perdue) : on se contente de garder le total du jour et le chrono du bandeau à jour.
    if (editingId !== null) {
      todayTotalEl.textContent = fmt(totalTodayAll());
      if (runningId != null && editingId !== runningId) {
        const timeEl = runningCardEl.querySelector('.running-time');
        if (timeEl) timeEl.textContent = fmtClock(rowMinutes(projects.find((x) => x.id === runningId)));
      }
      return;
    }
    render();
  }, 1000);
</script>
</body>
