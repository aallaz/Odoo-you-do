<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="theme-color" content="#f6f4f1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Report</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23f6f4f1%22/><path d=%22M32 66 v-22 M50 66 v-34 M68 66 v-14%22 stroke=%22%237b7b7b%22 stroke-width=%229%22 stroke-linecap=%22round%22/></svg>">

<link rel="stylesheet" href="../shared/style.css">
<script src="../shared/heartbeat.js" defer></script>
<style>
  :root {
    --main-width: 860px;
  }

  table { border-collapse: collapse; width: 100%; min-width: 560px; }

  .icon-btn {
    background: var(--card);
    width: 40px;
    height: 40px;
    border-radius: 12px;
    border: var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: var(--ink);
    cursor: pointer;
    flex: none;
  }

  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }

  .icon-btn svg { width: 18px; height: 18px; }

  .icon-btn.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

  /* --- Vue d'un jour : édition --- */

  .day-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }

  .day-heading { display: flex; align-items: baseline; gap: 10px; font-size: 14px; }

  .day-heading strong { color: var(--strong); font-size: 17px; font-weight: 600; }

  .day-toolbar-actions { display: flex; align-items: center; gap: 8px; }

  .day-view-toggle { display: flex; gap: 6px; }

  .view-btn {
    border: var(--border);
    background: var(--card);
    color: var(--ink);
    border-radius: 10px;
    padding: 0 12px;
    height: 40px;
    font-size: 12px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
  }

  .view-btn:hover { border-color: var(--accent); color: var(--accent); }

  .view-btn.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

  .chrono-time { font-variant-numeric: tabular-nums; white-space: nowrap; width: 1%; }

  tr.day-row.editable { cursor: pointer; }

  tr.day-row.editable:hover td { background: var(--bg); }

  tr.day-row-editing td {
    cursor: default;
    text-align: left;
    white-space: normal;
    padding: 14px;
  }

  .edit-form { display: flex; flex-direction: column; gap: 10px; width: 100%; text-align: left; }

  .edit-form-title { margin: 0; font-size: 14px; font-weight: 500; color: var(--strong); }

  .edit-or { font-size: 11px; opacity: 0.6; text-align: center; }

  .edit-duration-wrap {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .edit-duration-wrap input, .edit-duration-wrap textarea {
    border: var(--border);
    border-radius: 10px;
    padding: 7px 8px;
    font-size: 14px;
    font-family: inherit;
    text-transform: none;
    letter-spacing: normal;
    color: var(--ink);
    background: var(--bg);
  }

  .edit-duration-wrap textarea {
    resize: vertical;
    min-height: 70px;
    font-variant-numeric: tabular-nums;
  }

  .edit-hint { font-size: 11px; margin: 0; opacity: 0.7; }

  .edit-actions { display: flex; gap: 8px; justify-content: flex-end; }

  .edit-actions button {
    border: none;
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
  }

  .edit-save { background: var(--accent); color: var(--on-accent); }

  .edit-cancel { background: var(--card); border: var(--border); color: var(--ink); }

  .edit-delete {
    background: none;
    border: 1px solid var(--danger);
    color: var(--danger);
    margin-right: auto;
  }
</style>
</head>
<body>
<main>
  <a class="back-link" href="/">← Accueil</a>
  <h1>Report</h1>

  <div class="controls">
    <label>Du <input type="date" id="startDate"></label>
    <label>au <input type="date" id="endDate"></label>
    <button id="refreshBtn" type="button">Actualiser</button>
    <label>Arrondir à <select id="roundUnit">
      <option value="5">5 min</option>
      <option value="10">10 min</option>
      <option value="15" selected>15 min</option>
      <option value="30">30 min</option>
      <option value="60">60 min</option>
    </select></label>
    <button id="roundBtn" type="button">Arrondir</button>
    <label><input type="checkbox" id="showArchived"> Afficher les archives</label>
  </div>

  <div class="table-wrap" id="reportWrap"></div>
</main>

<script>
  // --- Données (chargées depuis le même backend que Timer : Timer/timer_store.py + Timer/timer.db) ---
  let projects = [];
  let runningState = null; // {projectId, projectName, startedAt} ou null — voir ensureNotRunningForToday

  async function loadProjects() {
    const res = await fetch('/api/timer/state', { cache: 'no-store' });
    const state = await res.json();
    applyState(state);
  }

  function applyState(state) {
    projects = state.projects;
    runningState = state.running || null;
  }

  // Date locale (jour civil), pas new Date().toISOString() : celle-ci est en UTC, donc fausse
  // pendant 1-2h après minuit en heure d'été/hiver (le serveur, lui, raisonne en date locale).
  const todayISO = () => {
    const d = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  };

  // Éditer aujourd'hui pendant qu'un chrono tourne est dangereux : le journal pré-rempli à
  // l'ouverture de l'éditeur ne contient pas encore la session en cours, donc l'arrêter APRÈS coup
  // (au moment d'enregistrer) ferait disparaître cette session à la sauvegarde (elle n'est pas dans
  // le texte édité). On vérifie donc ICI, avant d'ouvrir l'éditeur, jamais à l'enregistrement.
  // `projectId` : si fourni, ne bloque que si c'est CE projet qui tourne (édition "Par projet") ;
  // sinon bloque si N'IMPORTE QUEL projet tourne (édition "Par heure", qui touche tous les projets).
  async function ensureNotRunningForToday(day, projectId) {
    if (day !== todayISO() || !runningState) return true;
    if (projectId != null && runningState.projectId !== projectId) return true;

    if (!confirm(`Le chrono tourne sur "${runningState.projectName}".\n\nL'arrêter maintenant pour pouvoir éditer aujourd'hui ?`)) {
      return false;
    }
    await fetch('/api/timer/stop', { method: 'POST' });
    await loadProjects();
    currentReport = buildReport(startInput.value, endInput.value);
    return true;
  }

  function fmt(mins) {
    mins = Math.round(mins || 0);
    if (mins <= 0) return '0m';
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    if (h > 0) return `${h}h ${m}m`;
    return `${m}m`;
  }

  function fmtDay(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString('fr-CH', { weekday: 'short', day: 'numeric', month: 'short' });
  }

  function fmtHHMM(d) {
    return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  }

  // Durée -> heures décimales (accepte 1:30, 1h30, 1h, 2.5, "2,5") — même règle que dans Timer/ImportTimeSheet.
  function parseDurationHours(s) {
    s = (s || '').trim();
    if (!s) return null;
    let match;
    if ((match = s.match(/^(\d+):(\d{2})$/))) return +match[1] + +match[2] / 60;
    if ((match = s.match(/^(\d+)\s*h\s*(\d{1,2})?$/i))) return +match[1] + +(match[2] || 0) / 60;
    if (/^\d+([.,]\d+)?$/.test(s)) return parseFloat(s.replace(',', '.'));
    return null;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function buildReport(startDate, endDate) {
    const cells = {};
    const startedAtMap = {};
    const dayTotals = {};
    const projectTotals = {};
    let grandTotal = 0;
    const showArchived = document.getElementById('showArchived').checked;

    for (const project of projects) {
      for (const { date, minutes, startedAt, archived } of project.history) {
        if (minutes <= 0) continue;
        if (archived && !showArchived) continue;
        if (startDate && date < startDate) continue;
        if (endDate && date > endDate) continue;

        cells[date] ||= {};
        cells[date][project.id] = (cells[date][project.id] || 0) + minutes;
        startedAtMap[date] ||= {};
        startedAtMap[date][project.id] = startedAt || null;
        dayTotals[date] = (dayTotals[date] || 0) + minutes;
        projectTotals[project.id] = (projectTotals[project.id] || 0) + minutes;
        grandTotal += minutes;
      }
    }

    const days = Object.keys(cells).sort();
    const visibleProjects = projects.filter((p) => projectTotals[p.id]);

    return { days, cells, startedAtMap, dayTotals, projectTotals, grandTotal, visibleProjects };
  }

  let currentReport = null;
  let dayEditMode = false;
  let editingProjectId = null;
  let editingSessions = []; // sessions {startAt, endAt} du (projet, jour) dont la bulle d'édition est ouverte
  const reportWrap = document.getElementById('reportWrap');
  const startInput = document.getElementById('startDate');
  const endInput = document.getElementById('endDate');

  function renderTable(report) {
    currentReport = report;
    dayEditMode = false;
    editingProjectId = null;
    editingSessions = [];

    if (!report.days.length) {
      reportWrap.innerHTML = `<p class="empty-state">Aucun temps enregistré sur cette période.</p>`;
      return;
    }

    const header = report.visibleProjects.map((p) => `<th>${escapeHtml(p.name)}</th>`).join('');
    const rows = report.days.map((day) => {
      const cellsHtml = report.visibleProjects.map((p) => {
        const mins = report.cells[day][p.id] || 0;
        return mins ? `<td>${fmt(mins)}</td>` : `<td class="cell-empty">—</td>`;
      }).join('');
      return `<tr>
        <td class="day-link" data-day="${day}">${fmtDay(day)}</td>
        <td><strong>${fmt(report.dayTotals[day])}</strong></td>
        ${cellsHtml}
      </tr>`;
    }).join('');
    const footer = report.visibleProjects.map((p) => `<td>${fmt(report.projectTotals[p.id] || 0)}</td>`).join('');

    reportWrap.innerHTML = `
      <table>
        <thead><tr><th>Jour</th><th>Total</th>${header}</tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr><td>Total</td><td>${fmt(report.grandTotal)}</td>${footer}</tr></tfoot>
      </table>`;

    reportWrap.querySelectorAll('.day-link[data-day]').forEach((el) => {
      el.addEventListener('click', () => renderDay(el.dataset.day));
    });
  }

  // Un seul bouton "Retour" à la fois : toujours retirer l'ancien avant d'en poser un nouveau
  // (sinon chaque re-rendu de la vue jour — édition, sauvegarde, changement de mode — en empile un).
  function setBackButton(onClick) {
    document.querySelectorAll('.back-to-table').forEach((el) => el.remove());
    const backBtn = document.createElement('button');
    backBtn.className = 'back-to-table';
    backBtn.textContent = '← Retour au rapport';
    backBtn.addEventListener('click', () => { backBtn.remove(); onClick(); });
    reportWrap.after(backBtn);
  }

  // --- Vue d'un jour : deux modes --- "Par projet" (total + édition des sessions d'un projet) et
  // "Par heure" (journal chronologique de tous les projets du jour, lecture seule).
  let dayViewMode = 'project'; // 'project' | 'chrono'

  async function fetchAllDaySessions(day) {
    const res = await fetch(`/api/timer/log?day=${day}`, { cache: 'no-store' });
    return res.json(); // [{projectId, projectName, startAt, endAt}], endAt=null si en cours
  }

  async function renderDay(day) {
    const toolbarHtml = `
      <div class="day-toolbar">
        <div class="day-heading">
          <span>${fmtDay(day)}</span>
          <strong>${fmt(currentReport.dayTotals[day] || 0)}</strong>
        </div>
        <div class="day-toolbar-actions">
          <div class="day-view-toggle">
            <button class="view-btn ${dayViewMode === 'project' ? 'active' : ''}" data-mode="project" type="button">Par projet</button>
            <button class="view-btn ${dayViewMode === 'chrono' ? 'active' : ''}" data-mode="chrono" type="button">Par heure</button>
          </div>
          <button class="icon-btn ${dayEditMode ? 'active' : ''}" id="dayEditBtn" type="button" title="Éditer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9"/>
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/>
            </svg>
          </button>
        </div>
      </div>`;

    if (dayViewMode === 'chrono') {
      const sessions = (await fetchAllDaySessions(day)).sort((a, b) => a.startAt - b.startAt);

      if (dayEditMode) {
        const lines = sessions
          .filter((s) => s.endAt)
          .map((s) => `${fmtHHMM(new Date(s.startAt * 1000))}-${fmtHHMM(new Date(s.endAt * 1000))} ${s.projectName}`)
          .join('\n');
        reportWrap.innerHTML = `
          ${toolbarHtml}
          <div class="edit-form">
            <label class="edit-duration-wrap">Journal du jour (une ligne par session : HH:MM-HH:MM Projet)
              <textarea class="edit-day-log" rows="8">${escapeHtml(lines)}</textarea>
            </label>
            <p class="edit-hint">Enregistrer remplace tout le journal de ce jour, tous projets confondus. Un projet tapé qui n'existe pas encore est créé.</p>
            <div class="edit-actions">
              <button class="edit-cancel" id="chronoCancelBtn" type="button">Annuler</button>
              <button class="edit-save" id="chronoSaveBtn" type="button">Enregistrer</button>
            </div>
          </div>`;
        document.getElementById('chronoCancelBtn').addEventListener('click', () => {
          dayEditMode = false;
          renderDay(day);
        });
        document.getElementById('chronoSaveBtn').addEventListener('click', () => saveDayLog(day));
      } else {
        const rowsHtml = sessions.map((s) => {
          const inTxt = fmtHHMM(new Date(s.startAt * 1000));
          const outTxt = s.endAt ? fmtHHMM(new Date(s.endAt * 1000)) : 'en cours';
          return `<tr><td class="chrono-time">${inTxt}-${outTxt}</td><td>${escapeHtml(s.projectName)}</td></tr>`;
        }).join('');
        reportWrap.innerHTML = `
          ${toolbarHtml}
          <table>
            <thead><tr><th>Horaire</th><th>Projet</th></tr></thead>
            <tbody>${rowsHtml || '<tr><td colspan="2" class="empty-state">Aucune session détaillée pour ce jour.</td></tr>'}</tbody>
          </table>`;
      }
    } else {
      const rows = currentReport.visibleProjects
        .map((p) => ({
          p,
          mins: (currentReport.cells[day] || {})[p.id] || 0,
          startedAt: (currentReport.startedAtMap[day] || {})[p.id] || null,
        }))
        .filter((row) => row.mins > 0)
        .sort((a, b) => b.mins - a.mins);
      const rowsHtml = rows.map((row) => renderDayRow(row, day)).join('');

      reportWrap.innerHTML = `
        ${toolbarHtml}
        <table>
          <thead><tr><th>Projet</th><th>Temps</th></tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>`;

      if (dayEditMode) {
        reportWrap.querySelectorAll('tr.day-row.editable[data-id]').forEach((tr) => {
          tr.addEventListener('click', async () => {
            const id = Number(tr.dataset.id);
            if (!(await ensureNotRunningForToday(day, id))) return;
            editingSessions = await fetchDaySessions(day, id);
            editingProjectId = id;
            renderDay(day);
          });
        });
        const editingRow = reportWrap.querySelector('tr.day-row-editing');
        if (editingRow) {
          const id = Number(editingRow.dataset.id);
          editingRow.querySelector('.edit-cancel').addEventListener('click', () => {
            editingProjectId = null;
            editingSessions = [];
            renderDay(day);
          });
          editingRow.querySelector('.edit-save').addEventListener('click', () => saveDayEdit(id, day));
          editingRow.querySelector('.edit-delete').addEventListener('click', () => deleteDayEdit(id, day));
        }
      }
    }

    reportWrap.querySelector('#dayEditBtn').addEventListener('click', async () => {
      // "Par heure" touche tous les projets d'un coup : on bloque sur N'IMPORTE QUEL chrono en
      // cours avant même d'ouvrir l'éditeur (voir ensureNotRunningForToday). "Par projet" n'a pas
      // ce problème ici : le blocage, plus ciblé, se fait au clic sur la ligne du projet concerné.
      if (!dayEditMode && dayViewMode === 'chrono' && !(await ensureNotRunningForToday(day))) return;
      dayEditMode = !dayEditMode;
      editingProjectId = null;
      editingSessions = [];
      renderDay(day);
    });

    reportWrap.querySelectorAll('.view-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        if (btn.dataset.mode === dayViewMode) return;
        dayViewMode = btn.dataset.mode;
        dayEditMode = false;
        editingProjectId = null;
        editingSessions = [];
        renderDay(day);
      });
    });

    setBackButton(() => renderTable(currentReport));
  }

  // Filet de sécurité pour une course rare (un chrono démarre ailleurs pendant que l'éditeur est
  // ouvert ici) : ensureNotRunningForToday() bloque déjà normalement AVANT d'ouvrir l'éditeur, donc
  // ce cas ne devrait plus arriver en pratique. Si ça arrive quand même, on arrête le chrono puis on
  // FERME l'éditeur (jamais de ré-enregistrement automatique avec le texte déjà tapé : ce texte ne
  // contient pas la session qu'on vient de clore, la renvoyer telle quelle l'effacerait).
  async function handleSaveError(error, day) {
    if (/en cours/.test(error) && confirm(`${error}\n\nArrêter le chrono maintenant ? (il faudra rouvrir l'édition pour inclure cette dernière session)`)) {
      await fetch('/api/timer/stop', { method: 'POST' });
      await loadProjects();
      currentReport = buildReport(startInput.value, endInput.value);
      dayEditMode = false;
      editingProjectId = null;
      editingSessions = [];
      renderDay(day);
      return;
    }
    alert(error);
  }

  async function saveDayLog(day) {
    const text = reportWrap.querySelector('.edit-day-log').value.trim();
    if (!text) {
      if (!confirm('Vider complètement le journal de ce jour (toutes les sessions, tous projets) ?')) return;
    }
    const sessions = [];
    for (const raw of text.split('\n')) {
      const line = raw.trim();
      if (!line) continue;
      const m = line.match(/^(\d{1,2}:\d{2})\s*-\s*(\d{1,2}:\d{2})\s+(.+)$/);
      if (!m) { alert(`Ligne invalide (attendu HH:MM-HH:MM Projet) : "${line}"`); return; }
      sessions.push({ start: m[1], end: m[2], project: m[3].trim() });
    }
    const res = await fetch('/api/timer/set-day-log', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ date: day, sessions }),
    });
    const data = await res.json();
    if (data.error) { await handleSaveError(data.error, day); return; }
    applyState(data);

    dayEditMode = false;
    currentReport = buildReport(startInput.value, endInput.value);
    renderDay(day);
  }

  function renderDayRow(row, day) {
    const { p, mins, startedAt } = row;
    if (dayEditMode && editingProjectId === p.id) {
      return renderDayEditRow(p, mins, startedAt);
    }
    const editableAttrs = dayEditMode ? ' class="day-row editable"' : '';
    return `<tr${editableAttrs} data-id="${p.id}"><td>${escapeHtml(p.name)}</td><td><strong>${fmt(mins)}</strong></td></tr>`;
  }

  // Journal in/out du jour (toutes projets), filtré sur un projet : /api/timer/log ne couvre que
  // les sessions démarrées depuis l'ajout de cette fonctionnalité (rien de rétroactif).
  async function fetchDaySessions(day, projectId) {
    const res = await fetch(`/api/timer/log?day=${day}`, { cache: 'no-store' });
    const rows = await res.json();
    return rows.filter((s) => s.projectId === projectId && s.endAt); // sessions closes seulement
  }

  function renderDayEditRow(p, mins, startedAt) {
    const sessionLines = editingSessions
      .map((s) => `${fmtHHMM(new Date(s.startAt * 1000))}-${fmtHHMM(new Date(s.endAt * 1000))}`)
      .join('\n');
    const hint = editingSessions.length
      ? `Une ligne par session (HH:MM-HH:MM). Enregistrer remplace tout le journal de ce jour pour ce projet.`
      : `Aucune session détaillée connue pour ce jour (${fmt(mins)} au total${startedAt ? `, débuté à ${fmtHHMM(new Date(startedAt * 1000))}` : ''}) — remplis les plages ci-dessous, ou utilise Durée totale.`;
    return `
      <tr class="day-row-editing" data-id="${p.id}">
        <td colspan="2">
          <div class="edit-form">
            <p class="edit-form-title">${escapeHtml(p.name)}</p>
            <label class="edit-duration-wrap">Sessions
              <textarea class="edit-sessions" rows="4" placeholder="10:50-11:20&#10;12:15-12:35">${escapeHtml(sessionLines)}</textarea>
            </label>
            <p class="edit-or">— ou, si tu ne connais pas les horaires détaillés —</p>
            <label class="edit-duration-wrap">Durée totale
              <input class="edit-duration" type="text" placeholder="ex. 1h30, 1:30, 2.5">
            </label>
            <p class="edit-hint">${escapeHtml(hint)}</p>
            <div class="edit-actions">
              <button class="edit-delete" type="button">Supprimer</button>
              <button class="edit-cancel" type="button">Annuler</button>
              <button class="edit-save" type="button">Enregistrer</button>
            </div>
          </div>
        </td>
      </tr>`;
  }

  async function saveDayEdit(id, day) {
    const row = reportWrap.querySelector(`tr.day-row-editing[data-id="${id}"]`);
    if (!row) { editingProjectId = null; renderDay(day); return; }

    const sessionsText = row.querySelector('.edit-sessions').value.trim();
    const durationVal = row.querySelector('.edit-duration').value.trim();
    let data;
    if (sessionsText) {
      // Une ligne par session : remplace tout le journal in/out du jour pour ce projet.
      const lines = sessionsText.split('\n').map((l) => l.trim()).filter(Boolean);
      const sessions = [];
      for (const line of lines) {
        const m = line.match(/^(\d{1,2}:\d{2})\s*-\s*(\d{1,2}:\d{2})$/);
        if (!m) { alert(`Ligne invalide (attendu HH:MM-HH:MM) : "${line}"`); return; }
        sessions.push({ start: m[1], end: m[2] });
      }
      const res = await fetch('/api/timer/set-sessions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, date: day, sessions }),
      });
      data = await res.json();
    } else if (durationVal) {
      // Durée directe : ne demande pas l'heure de début, remplace juste le total du (projet, jour).
      const hours = parseDurationHours(durationVal);
      if (hours === null) { alert('Durée invalide (attendu 1h30, 1:30 ou 2.5)'); return; }
      const res = await fetch('/api/timer/set-minutes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, date: day, minutes: hours * 60 }),
      });
      data = await res.json();
    } else {
      alert('Indique au moins une session (HH:MM-HH:MM), ou une durée totale.');
      return;
    }
    if (data.error) { await handleSaveError(data.error, day); return; }
    applyState(data);

    editingProjectId = null;
    editingSessions = [];
    currentReport = buildReport(startInput.value, endInput.value);
    renderDay(day);
  }

  async function deleteDayEdit(id, day) {
    if (!confirm('Supprimer définitivement ces heures ?')) return;
    const res = await fetch('/api/timer/delete-entry', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, date: day }),
    });
    const data = await res.json();
    if (data.error) { await handleSaveError(data.error, day); return; }
    applyState(data);
    editingProjectId = null;
    editingSessions = [];
    currentReport = buildReport(startInput.value, endInput.value);
    renderDay(day);
  }

  async function refresh() {
    reportWrap.innerHTML = `<p class="empty-state">Chargement…</p>`;
    await loadProjects();
    renderTable(buildReport(startInput.value, endInput.value));
  }

  const today = new Date();
  endInput.value = today.toISOString().slice(0, 10);
  startInput.value = new Date(today.getFullYear(), today.getMonth(), 1).toISOString().slice(0, 10);

  async function roundTimes() {
    const unit = document.getElementById('roundUnit').value;
    const start = startInput.value;
    const end = endInput.value;
    if (!start || !end) { alert('Choisis une période (du / au).'); return; }

    const res = await fetch('/api/timer/round/preview', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ start, end, unit: Number(unit) }),
    });
    const data = await res.json();
    if (data.error) { alert(data.error); return; }

    renderRoundPreview(data.changes, data.dayTotals, start, end, Number(unit));
  }

  function minutesToHM(totalMinutes) {
    const total = Math.max(0, Math.round(totalMinutes));
    return { h: Math.floor(total / 60), m: total % 60 };
  }

  function rowMinutes(i) {
    const h = Number(reportWrap.querySelector(`.round-after-h[data-index="${i}"]`).value) || 0;
    const m = Number(reportWrap.querySelector(`.round-after-m[data-index="${i}"]`).value) || 0;
    return h * 60 + m;
  }

  function recalcDayTotal(day, changes, dayBaseMinutes) {
    let total = dayBaseMinutes[day] || 0;
    changes.forEach((c, i) => { if (c.day === day) total += rowMinutes(i); });
    const cell = reportWrap.querySelector(`.round-day-total[data-day="${day}"]`);
    if (cell) {
      const { h, m } = minutesToHM(total);
      cell.textContent = `${h}h${m}m`;
    }
  }

  function renderRoundPreview(changes, dayTotals, start, end, unit) {
    if (!changes.length) {
      reportWrap.innerHTML = `<p class="empty-state">Rien à arrondir du ${start} au ${end} à ${unit} minutes : tout est déjà sur ce pas.</p>`;
      setBackButton(refresh);
      return;
    }

    // Part du total de chaque jour qui vient d'entrées non listées ici (déjà sur le bon pas) :
    // total du jour (calculé côté serveur) moins la somme des "après" des lignes affichées.
    const dayBaseMinutes = {};
    for (const day of Object.keys(dayTotals)) {
      const changedSum = changes.filter((c) => c.day === day).reduce((sum, c) => sum + c.afterMinutes, 0);
      dayBaseMinutes[day] = dayTotals[day] - changedSum;
    }

    let rowsHtml = '';
    changes.forEach((c, i) => {
      const { h, m } = minutesToHM(c.afterMinutes);
      rowsHtml += `
        <tr data-project-id="${c.projectId}" data-day="${c.day}">
          <td>${fmtDay(c.day)}</td>
          <td>${escapeHtml(c.projectName)}</td>
          <td>${fmt(c.beforeMinutes)}</td>
          <td>
            <input class="round-after-h" type="number" min="0" step="1" data-index="${i}" value="${h}" style="width:48px;">h
            <input class="round-after-m" type="number" min="0" max="59" step="1" data-index="${i}" value="${m}" style="width:48px;">m
          </td>
        </tr>`;
      const isLastOfDay = i === changes.length - 1 || changes[i + 1].day !== c.day;
      if (isLastOfDay) {
        const { h: th, m: tm } = minutesToHM(dayTotals[c.day] || 0);
        rowsHtml += `
          <tr class="round-day-total-row">
            <td colspan="3" style="text-align:right;"><strong>Total ${fmtDay(c.day)}</strong></td>
            <td><strong class="round-day-total" data-day="${c.day}">${th}h${tm}m</strong></td>
          </tr>`;
      }
    });

    reportWrap.innerHTML = `
      <p>${changes.length} entrée(s) seraient arrondies à ${unit} minutes (du ${start} au ${end}). La colonne "Après" est modifiable à la main avant de confirmer.</p>
      <table>
        <thead><tr><th>Jour</th><th>Projet</th><th>Avant</th><th>Après</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
      <div class="edit-actions" style="margin-top:12px;">
        <button class="edit-cancel" id="roundCancelBtn" type="button">Annuler</button>
        <button class="edit-save" id="roundConfirmBtn" type="button">Confirmer l'arrondi</button>
      </div>`;

    reportWrap.querySelectorAll('.round-after-h, .round-after-m').forEach((input) => {
      input.addEventListener('input', () => {
        const i = Number(input.dataset.index);
        recalcDayTotal(changes[i].day, changes, dayBaseMinutes);
      });
    });

    document.getElementById('roundCancelBtn').addEventListener('click', refresh);
    document.getElementById('roundConfirmBtn').addEventListener('click', () => applyRound(changes, start, end));
  }

  async function applyRound(changes, start, end) {
    const finalChanges = changes.map((c, i) => ({ projectId: c.projectId, day: c.day, afterMinutes: rowMinutes(i) }));

    const res = await fetch('/api/timer/round/apply', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ changes: finalChanges }),
    });
    const data = await res.json();
    if (data.error) { alert(data.error); return; }
    applyState(data);
    renderTable(buildReport(start, end));
  }

  startInput.addEventListener('change', refresh);
  endInput.addEventListener('change', refresh);
  document.getElementById('refreshBtn').addEventListener('click', refresh);
  document.getElementById('roundBtn').addEventListener('click', roundTimes);
  document.getElementById('showArchived').addEventListener('change', refresh);

  refresh();
</script>
</body>
</html>
