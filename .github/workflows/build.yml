name: Build

# PyInstaller ne cross-compile pas : on build sur chaque OS cible (voir build_exe.py).
# Déclenché à la main (Actions > Build > Run workflow) ou sur un tag "v*" (ex. v1.0.0),
# qui attache en plus les deux exécutables à une Release GitHub.
on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: OdooYouDo-windows
            build_path: dist/OdooYouDo.exe
          - os: macos-latest
            artifact: OdooYouDo-macos
            build_path: dist/OdooYouDo.app

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installe les dépendances
        run: pip install -r requirements.txt -r requirements-build.txt

      - name: Build
        run: python build_exe.py

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.build_path }}

  release:
    # Seulement sur un tag "v*" : attache les deux builds à une Release GitHub.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zippe les artefacts macOS/Windows pour la release
        run: |
          cd artifacts
          zip -r ../OdooYouDo-windows.zip OdooYouDo-windows
          zip -r ../OdooYouDo-macos.zip OdooYouDo-macos

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            OdooYouDo-windows.zip
            OdooYouDo-macos.zip
