<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="theme-color" content="#f6f4ee">
<title>Timer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23f6f4ee%22/><circle cx=%2250%22 cy=%2254%22 r=%2228%22 fill=%22none%22 stroke=%22%23111%22 stroke-width=%2210%22/><path d=%22M44 42 l16 12-16 12z%22 fill=%22%23e63229%22/></svg>">

<style>
  /* UI-Minimal-Odoo : voir ~/.claude/skills/ui-minimal-odoo/SKILL.md */
  :root {
    --paper: #f6f4ee;
    --card: #ffffff;
    --ink: #111111;
    --muted: #6b6b6b;
    --accent: #e63229;
    --accent-ink: #ffffff;

    --border: 2px solid var(--ink);
    --u: 8px;
    --font: 'Jost', 'Futura', 'Century Gothic', 'Avenir Next', 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; border-radius: 0; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    min-height: 100dvh;
  }

  body {
    display: flex;
    justify-content: center;
    padding: 24px 16px 64px;
  }

  main { width: 100%; max-width: 640px; }

  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* --- Libellés (12 px majuscules) --- */
  .label {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin: 0;
  }

  .back-link {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink);
    text-decoration: none;
    margin-bottom: 24px;
  }
  .back-link:hover { background: var(--ink); color: var(--paper); }

  .title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  h1 {
    font-size: 40px;
    font-weight: 700;
    line-height: 1;
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }

  .icon-btn {
    width: 48px;
    height: 48px;
    background: var(--card);
    border: var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
    text-decoration: none;
  }
  .icon-btn:hover { background: var(--ink); color: var(--paper); }
  .icon-btn svg { width: 24px; height: 24px; }

  .today-total { margin: 0 0 32px; font-size: 14px; color: var(--muted); }
  .today-total strong { color: var(--ink); font-weight: 700; }

  /* --- En cours --- */
  .running-card {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px;
    background: var(--ink);
    color: var(--paper);
    border: var(--border);
    margin-bottom: 24px;
  }
  .running-card .label { color: #bdbdbd; margin-bottom: 8px; }
  .running-card.empty {
    background: var(--card);
    color: var(--muted);
    justify-content: center;
    font-size: 14px;
    padding: 24px 16px;
  }

  .running-dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

  .running-info { flex: 1; min-width: 0; }
  .running-name { margin: 0; font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .running-time {
    font-variant-numeric: tabular-nums;
    font-size: 24px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .stop-btn {
    width: 48px;
    height: 48px;
    border: 2px solid var(--paper);
    background: var(--accent);
    color: var(--accent-ink);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .stop-btn:hover { background: var(--paper); color: var(--ink); }
  .stop-btn svg { width: 20px; height: 20px; }

  /* --- Saisie --- */
  .input-wrap { position: relative; margin-bottom: 32px; }

  .input-row {
    display: flex;
    align-items: stretch;
    background: var(--card);
    border: var(--border);
  }
  .input-row:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }

  .input-row input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    font-size: 16px;
    font-family: inherit;
    color: var(--ink);
    padding: 0 16px;
    height: 48px;
  }
  .input-row input::placeholder { color: var(--muted); }

  .start-btn {
    width: 48px;
    height: 48px;
    border: none;
    border-left: var(--border);
    background: var(--accent);
    color: var(--accent-ink);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .start-btn:hover:not(:disabled) { background: var(--ink); }
  .start-btn:disabled { opacity: 0.35; cursor: default; }
  .start-btn svg { width: 18px; height: 18px; }

  .suggestions {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: var(--card);
    border: var(--border);
    border-top: none;
    z-index: 5;
    display: none;
  }
  .suggestions.open { display: block; }

  .suggestion {
    padding: 0 16px;
    min-height: 48px;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .suggestion:hover, .suggestion.active { background: var(--ink); color: var(--paper); }
  .suggestion + .suggestion { border-top: var(--border); }
  .suggestion .s-time { font-size: 12px; color: var(--muted); flex-shrink: 0; }
  .suggestion:hover .s-time, .suggestion.active .s-time { color: #bdbdbd; }
  .suggestion.create { font-weight: 700; }

  /* --- Liste des projets --- */
  .section-label { margin: 0 0 16px; padding-bottom: 8px; border-bottom: var(--border); }

  .project-list { display: flex; flex-direction: column; gap: 8px; }

  .row {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--card);
    border: var(--border);
    padding: 8px 16px 8px 8px;
  }
  .row.running { border-left: 8px solid var(--accent); padding-left: 0; }

  .play-btn {
    width: 40px;
    height: 40px;
    border: var(--border);
    background: var(--card);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    color: var(--ink);
  }
  .play-btn:hover { background: var(--ink); color: var(--paper); }
  .play-btn svg { width: 16px; height: 16px; }
  .row.running .play-btn { background: var(--ink); color: var(--accent); margin-left: 8px; }

  .row .name {
    flex: 1;
    min-width: 0;
    font-size: 16px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .row .today-time {
    font-size: 14px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
    min-width: 56px;
    text-align: right;
  }

  .row .date {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--muted);
    flex-shrink: 0;
    min-width: 40px;
    text-align: right;
  }

  .empty-list { text-align: center; font-size: 14px; color: var(--muted); padding: 32px 0; }
</style>
</head>
<body>
<main>
  <a class="back-link" href="/">← Accueil</a>

  <div class="title-row">
    <h1>Timer</h1>
    <a class="icon-btn" href="/report" title="Report">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <rect x="3" y="12" width="5" height="8"/>
        <rect x="9.5" y="4" width="5" height="16"/>
        <rect x="16" y="9" width="5" height="11"/>
      </svg>
    </a>
  </div>
  <p class="today-total">Aujourd'hui : <strong id="todayTotal">0m</strong></p>

  <div id="runningCard"></div>

  <div class="input-wrap">
    <div class="input-row">
      <input type="text" id="projectInput" placeholder="Sur quoi travailles-tu ?" autocomplete="off">
      <button class="start-btn" id="startBtn" disabled title="Démarrer">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg>
      </button>
    </div>
    <div class="suggestions" id="suggestions"></div>
  </div>

  <p class="label section-label">Projets</p>
  <div class="project-list" id="projectList"></div>
</main>

<script>
  // --- État (chargé depuis le backend : Timer/timer_store.py + Timer/timer.db) ---
  // `history` garde le temps par jour travaillé : [{date, minutes}, ...] trié du plus ancien au plus récent.
  // La ligne du projet n'affiche QUE la dernière entrée (dernier jour travaillé) ; le total (tri "plus utilisé")
  // additionne tout l'historique.
  let projects = [];
  let runningId = null;    // id (number) du projet en cours, ou null
  let runningSince = null; // équivalent Date.now() du started_at renvoyé par le serveur
  let activeSuggestionIndex = -1;

  const todayISO = () => new Date().toISOString().slice(0, 10);

  function fmt(mins) {
    mins = Math.round(mins);
    if (mins <= 0) return '-';
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    if (h > 0) return `${h}h ${m}m`;
    return `${m}m`;
  }

  function fmtClock(mins) {
    const totalSeconds = Math.round(mins * 60);
    const h = Math.floor(totalSeconds / 3600);
    const m = Math.floor((totalSeconds % 3600) / 60);
    const s = totalSeconds % 60;
    const pad = (n) => String(n).padStart(2, '0');
    return `${pad(h)}:${pad(m)}:${pad(s)}`;
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    const [y, m, d] = iso.split('-').map(Number);
    return `${d}/${m}`;
  }

  function lastEntry(p) {
    return p.history.length ? p.history[p.history.length - 1] : null;
  }

  // Minutes à afficher sur la ligne : celles du DERNIER jour travaillé uniquement
  // (+ le direct en cours si ce projet tourne).
  function rowMinutes(p) {
    const entry = lastEntry(p);
    let mins = entry ? entry.minutes : 0;
    if (p.id === runningId) mins += (Date.now() - runningSince) / 60000;
    return mins;
  }

  function rowDate(p) {
    const entry = lastEntry(p);
    if (entry) return entry.date;
    // Projet flambant neuf, en cours de chronométrage, pas encore d'entrée d'historique
    // (elle n'est créée qu'à l'arrêt) -> on l'affiche/trie comme "aujourd'hui".
    return p.id === runningId ? todayISO() : null;
  }

  function totalMinutes(p) {
    const base = p.history.reduce((sum, h) => sum + h.minutes, 0);
    return p.id === runningId ? base + (Date.now() - runningSince) / 60000 : base;
  }

  function totalTodayAll() {
    const today = todayISO();
    return projects.reduce((sum, p) => {
      const entry = p.history.find((h) => h.date === today);
      let mins = entry ? entry.minutes : 0;
      if (p.id === runningId) mins += (Date.now() - runningSince) / 60000;
      return sum + mins;
    }, 0);
  }

  function sortedProjects() {
    return [...projects].sort((a, b) => {
      const da = rowDate(a) || '';
      const db = rowDate(b) || '';
      if (da !== db) return da < db ? 1 : -1;
      return totalMinutes(b) - totalMinutes(a);
    });
  }

  function applyState(state) {
    projects = state.projects;
    if (state.running) {
      runningId = state.running.projectId;
      runningSince = state.running.startedAt * 1000;
    } else {
      runningId = null;
      runningSince = null;
    }
  }

  async function loadState() {
    const res = await fetch('/api/timer/state', { cache: 'no-store' });
    applyState(await res.json());
    render();
  }

  async function startProject(name) {
    name = name.trim();
    if (!name) return;

    projectInput.value = '';
    closeSuggestions();

    const res = await fetch('/api/timer/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name }),
    });
    applyState(await res.json());
    render();
  }

  async function stopRunning() {
    const res = await fetch('/api/timer/stop', { method: 'POST' });
    applyState(await res.json());
    render();
  }

  function toggleProject(id) {
    if (runningId === id) {
      stopRunning();
    } else {
      const p = projects.find((x) => x.id === id);
      if (p) startProject(p.name);
    }
  }

  // --- Rendu ---
  const runningCardEl = document.getElementById('runningCard');
  const projectListEl = document.getElementById('projectList');
  const todayTotalEl = document.getElementById('todayTotal');
  const projectInput = document.getElementById('projectInput');
  const startBtn = document.getElementById('startBtn');
  const suggestionsEl = document.getElementById('suggestions');

  function render() {
    todayTotalEl.textContent = fmt(totalTodayAll());

    if (runningId != null) {
      const p = projects.find((x) => x.id === runningId);
      const mins = rowMinutes(p);
      runningCardEl.innerHTML = `
        <div class="running-card">
          <span class="running-dot"></span>
          <div class="running-info">
            <p class="label">En cours</p>
            <p class="running-name">${escapeHtml(p.name)}</p>
          </div>
          <div class="running-time">${fmtClock(mins)}</div>
          <button class="stop-btn" id="stopBtn" title="Arrêter">
            <svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14"/></svg>
          </button>
        </div>`;
      document.getElementById('stopBtn').addEventListener('click', stopRunning);
    } else {
      runningCardEl.innerHTML = `<div class="running-card empty">Aucun chronométrage en cours</div>`;
    }

    const list = sortedProjects();
    if (list.length === 0) {
      projectListEl.innerHTML = `<p class="empty-list">Aucun projet pour l'instant.</p>`;
      return;
    }

    projectListEl.innerHTML = list.map((p) => {
      const isRunning = p.id === runningId;
      const icon = isRunning
        ? `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14"/></svg>`
        : `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg>`;
      return `
        <div class="row ${isRunning ? 'running' : ''}" data-id="${p.id}">
          <button class="play-btn" title="${isRunning ? 'Arrêter' : 'Démarrer'}">${icon}</button>
          <span class="name">${escapeHtml(p.name)}</span>
          <span class="today-time">${fmt(rowMinutes(p))}</span>
          <span class="date">${fmtDate(rowDate(p))}</span>
        </div>`;
    }).join('');

    projectListEl.querySelectorAll('.row').forEach((row) => {
      row.querySelector('.play-btn').addEventListener('click', () => toggleProject(Number(row.dataset.id)));
    });
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // --- Saisie + autocomplétion ---
  function closeSuggestions() {
    suggestionsEl.classList.remove('open');
    suggestionsEl.innerHTML = '';
    activeSuggestionIndex = -1;
  }

  function updateSuggestions() {
    const q = projectInput.value.trim().toLowerCase();
    startBtn.disabled = q.length === 0;

    if (!q) { closeSuggestions(); return; }

    const matches = projects.filter((p) => p.name.toLowerCase().includes(q)).slice(0, 5);
    const exact = projects.some((p) => p.name.toLowerCase() === q);

    let html = matches.map((p) => `
      <div class="suggestion" data-name="${escapeHtml(p.name)}">
        <span>${escapeHtml(p.name)}</span>
        <span class="s-time">${fmt(totalMinutes(p))}</span>
      </div>`).join('');

    if (!exact) {
      html += `<div class="suggestion create" data-name="${escapeHtml(projectInput.value.trim())}">+ Créer « ${escapeHtml(projectInput.value.trim())} »</div>`;
    }

    suggestionsEl.innerHTML = html;
    suggestionsEl.classList.add('open');
    activeSuggestionIndex = -1;

    suggestionsEl.querySelectorAll('.suggestion').forEach((el) => {
      el.addEventListener('click', () => startProject(el.dataset.name));
    });
  }

  projectInput.addEventListener('input', updateSuggestions);
  projectInput.addEventListener('focus', updateSuggestions);
  projectInput.addEventListener('keydown', (e) => {
    const items = Array.from(suggestionsEl.querySelectorAll('.suggestion'));
    if (e.key === 'ArrowDown' && items.length) {
      e.preventDefault();
      activeSuggestionIndex = Math.min(activeSuggestionIndex + 1, items.length - 1);
      items.forEach((el, i) => el.classList.toggle('active', i === activeSuggestionIndex));
    } else if (e.key === 'ArrowUp' && items.length) {
      e.preventDefault();
      activeSuggestionIndex = Math.max(activeSuggestionIndex - 1, 0);
      items.forEach((el, i) => el.classList.toggle('active', i === activeSuggestionIndex));
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (activeSuggestionIndex >= 0 && items[activeSuggestionIndex]) {
        startProject(items[activeSuggestionIndex].dataset.name);
      } else if (projectInput.value.trim()) {
        startProject(projectInput.value.trim());
      }
    } else if (e.key === 'Escape') {
      closeSuggestions();
    }
  });

  startBtn.addEventListener('click', () => {
    if (projectInput.value.trim()) startProject(projectInput.value.trim());
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.input-wrap')) closeSuggestions();
  });

  loadState();
  setInterval(render, 1000);
</script>
</body>
</html>
