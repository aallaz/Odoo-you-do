<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="theme-color" content="#f6f4f1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Hours</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23f2f1f5%22/><path d=%22M50 24 v22 M39 35 h22%22 stroke=%22%2303fc52%22 stroke-width=%229%22 stroke-linecap=%22round%22/><path d=%22M39 68 h22%22 stroke=%22%237b7b7b%22 stroke-width=%229%22 stroke-linecap=%22round%22/></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap">

<style>
  /* Style "Financial Web App" : plat, sans dégradé ni ombre (voir Timer/index-test2.html) */
  :root {
    --ink: #7b7b7b;
    --muted: #7b7b7b;
    --faint: rgba(123, 123, 123, 0.6);
    --bg: #f6f4f1;
    --card: #f6f4f1;
    --line: #7b7b7b;
    --sep: rgba(123, 123, 123, 0.3);
    --amber: #03fc52;
    --amber-deep: #03fc52;
    --coral: #fc4345;  /* exception : les valeurs négatives restent en fc4345 */
    --green: #03fc52;
    --font: 'Prompt', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    min-height: 100dvh;
  }

  body {
    display: flex;
    justify-content: center;
    padding: 24px 18px 60px;
  }

  main { width: 100%; max-width: 520px; }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--muted);
    text-decoration: none;
    margin-bottom: 16px;
  }
  .back-link:hover { color: var(--amber-deep); }

  h1 {
    font-size: 28px;
    font-weight: 500;
    margin: 0 0 16px;
    letter-spacing: -0.01em;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin-bottom: 20px;
  }

  .controls label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--muted);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 7px 10px;
  }

  .controls input[type="date"] {
    border: none;
    outline: none;
    background: transparent;
    font: inherit;
    color: var(--ink);
  }

  .controls button {
    font: inherit;
    font-weight: 500;
    padding: 9px 16px;
    border-radius: 12px;
    border: 1px solid var(--amber);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
  }
  .controls button:hover { background: #ffffff; }

  .table-wrap {
    padding-bottom: 20px;
    scrollbar-width: thin;
    scrollbar-color: var(--ink) transparent;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: auto;
  }

  table { border-collapse: collapse; width: 100%; }

  th, td {
    padding: 11px 14px;
    border-bottom: 1px solid var(--sep);
    text-align: right;
    white-space: nowrap;
    font-size: 13.5px;
  }

  th:first-child, td:first-child {
    position: sticky;
    left: 0;
    text-align: left;
    background: var(--card);
  }

  thead th {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    font-weight: 500;
  }

  tbody tr:hover td { background: #ffffff; }
  tbody tr:hover td:first-child { background: #ffffff; }

  tfoot td {
    font-weight: 600;
    border-top: 1px solid var(--ink);
    border-bottom: none;
  }

  .day-link {
    cursor: pointer;
    font-weight: 500;
    color: var(--amber-deep);
  }
  .day-link:hover { text-decoration: underline; }

  .cell-empty { color: var(--faint); }
  .plus { color: var(--green); font-weight: 500; }
  .minus { color: var(--coral); font-weight: 500; }
  .zero { color: var(--muted); }
  .live { font-size: 11.5px; color: var(--amber-deep); margin-left: 6px; }
  .controls input[type="time"] { border: none; outline: none; background: transparent; font: inherit; color: var(--ink); }
  th:nth-child(n+2), td:nth-child(n+2) { width: 1%; }

  .empty-state {
    padding: 36px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 13.5px;
  }

  .back-to-table {
    margin-top: 14px;
    font-size: 13px;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
  }
  .back-to-table:hover { color: var(--amber-deep); }
</style>
</head>
<body>
<main>
  <a class="back-link" href="/">← Accueil</a>
  <h1>Hours</h1>

  <div class="controls">
    <label>Du <input type="date" id="startDate"></label>
    <label>au <input type="date" id="endDate"></label>
    <label>Objectif <input type="time" id="target" value="08:00"></label>
    <button id="refreshBtn" type="button">Actualiser</button>
  </div>

  <div class="table-wrap" id="wrap"></div>
</main>

<script>
  // Heures de pointage Odoo par jour (/api/attendance, lecture seule) comparées à l'objectif quotidien.
  const wrap = document.getElementById('wrap');
  const startInput = document.getElementById('startDate');
  const endInput = document.getElementById('endDate');
  const targetInput = document.getElementById('target');

  let days = [];   // [{date, minutes, open}]

  function localISO(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  // 502 -> "8:22"
  function fmtHM(mins) {
    const m = Math.round(mins);
    return `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`;
  }

  // +22 -> "+0:22", -25 -> "-0:25", 0 -> "0:00"
  function fmtDelta(mins) {
    const m = Math.round(mins);
    if (m === 0) return '<span class="zero">0:00</span>';
    const sign = m > 0 ? '+' : '-';
    return `<span class="${m > 0 ? 'plus' : 'minus'}">${sign}${fmtHM(Math.abs(m))}</span>`;
  }

  function fmtDay(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString('fr-CH', { weekday: 'short', day: 'numeric', month: 'short' });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function targetMinutes() {
    const [h, m] = (targetInput.value || '08:00').split(':').map(Number);
    return h * 60 + m;
  }

  function render() {
    if (!days.length) {
      wrap.innerHTML = '<p class="empty-state">Aucun pointage sur cette période.</p>';
      return;
    }

    const target = targetMinutes();
    let sumMinutes = 0;
    let sumDelta = 0;

    const rows = days.map(({ date, minutes, open }) => {
      const mins = Math.round(minutes);
      const delta = mins - target;
      sumMinutes += mins;
      sumDelta += delta;
      const live = open ? '<span class="live">● en cours</span>' : '';
      return `<tr><td>${fmtDay(date)}${live}</td><td><strong>${fmtHM(mins)}</strong></td><td>${fmtDelta(delta)}</td></tr>`;
    }).join('');

    wrap.innerHTML = `
      <table>
        <thead><tr><th>Jour</th><th>Heures</th><th>Écart</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr><td>Total · ${days.length} j</td><td>${fmtHM(sumMinutes)}</td><td>${fmtDelta(sumDelta)}</td></tr></tfoot>
      </table>`;
  }

  async function refresh() {
    try {
      const res = await fetch(`/api/attendance?start=${startInput.value}&end=${endInput.value}`, { cache: 'no-store' });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `Erreur ${res.status}`);
      days = data;
      render();
    } catch (err) {
      wrap.innerHTML = `<p class="empty-state">${escapeHtml(err.message)}</p>`;
    }
  }

  // Objectif mémorisé (facultatif : le stockage peut être indisponible).
  try { targetInput.value = localStorage.getItem('hoursTarget') || targetInput.value; } catch (e) {}

  const now = new Date();
  endInput.value = localISO(now);
  startInput.value = localISO(new Date(now.getFullYear(), now.getMonth(), 1));

  startInput.addEventListener('change', refresh);
  endInput.addEventListener('change', refresh);
  targetInput.addEventListener('change', () => {
    try { localStorage.setItem('hoursTarget', targetInput.value); } catch (e) {}
    render();
  });
  document.getElementById('refreshBtn').addEventListener('click', refresh);

  refresh();
  setInterval(refresh, 60000);   // le total du jour avance tant que la sortie n'est pas pointée
</script>
</body>
</html>
