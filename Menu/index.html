<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="theme-color" content="#f6f4f1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Accueil</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23f6f4f1%22/><circle cx=%2250%22 cy=%2250%22 r=%2226%22 fill=%22none%22 stroke=%22%237b7b7b%22 stroke-width=%228%22/><line x1=%2250%22 y1=%2250%22 x2=%2250%22 y2=%2230%22 stroke=%22%23ecab0f%22 stroke-width=%228%22 stroke-linecap=%22round%22/></svg>">

<link rel="stylesheet" href="../shared/style.css">
<style>
  :root {
    --main-width: 680px;
  }

  html, body { margin: 0; padding: 0; min-height: 100dvh; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    display: flex;
    justify-content: center;
    padding: 56px 24px;
  }

  .eyebrow { font-size: 13px; margin: 0 0 28px 4px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
    gap: 32px 20px;
  }

  a.tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--ink);
  }

  .icon-box {
    background: #ffffff;
    width: 84px;
    height: 84px;
    border: 1px solid var(--line);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  a.tile:hover .icon-box,
  a.tile:focus-visible .icon-box { border-color: var(--accent); }

  a.tile:hover .label { color: var(--accent); }

  .icon-box svg { width: 46px; height: 46px; }

  .label { font-size: 14px; font-weight: 500; text-align: center; }

  .restart-link {
    color: var(--muted, #7b7b7b);
    text-decoration: none;
    cursor: pointer;
  }

  .restart-link:hover { color: var(--accent); }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Odoo you do <a class="restart-link" id="restart-link">- redémarrer</a></p>

  <div class="grid">
    <a class="tile" href="/gohome">
      <div class="icon-box">
        <svg viewBox="0 0 64 64" fill="none">
          <circle cx="32" cy="32" r="24" stroke="#000000" stroke-width="6"/>
          <line x1="32" y1="32" x2="32" y2="17" stroke="#ecab0f" stroke-width="6" stroke-linecap="round"/>
          <line x1="32" y1="32" x2="43" y2="32" stroke="#ecab0f" stroke-width="6" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="label">GoHome</span>
    </a>

    <a class="tile" href="/import-timesheet">
      <div class="icon-box">
        <svg viewBox="0 0 64 64" fill="none">
          <rect x="8" y="6" width="32" height="42" rx="5" fill="#000000"/>
          <rect x="15" y="15" width="18" height="4" rx="2" fill="#ffffff"/>
          <rect x="15" y="24" width="18" height="4" rx="2" fill="#ffffff"/>
          <rect x="15" y="33" width="10" height="4" rx="2" fill="#ffffff"/>
          <circle cx="45" cy="42" r="15" fill="#ecab0f"/>
          <path d="M45 34.5 v13 M38.5 42.5 l6.5 6.5 6.5-6.5" stroke="#000000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="label">Import TimeSheet</span>
    </a>

    <a class="tile" href="/export-timesheet">
      <div class="icon-box">
        <svg viewBox="0 0 64 64" fill="none">
          <rect x="8" y="6" width="32" height="42" rx="5" fill="#000000"/>
          <rect x="15" y="15" width="18" height="4" rx="2" fill="#ffffff"/>
          <rect x="15" y="24" width="18" height="4" rx="2" fill="#ffffff"/>
          <rect x="15" y="33" width="10" height="4" rx="2" fill="#ffffff"/>
          <circle cx="45" cy="42" r="15" fill="#ecab0f"/>
          <path d="M45 47.5 v-13 M38.5 41.5 l6.5-6.5 6.5 6.5" stroke="#000000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="label">Export TimeSheet</span>
    </a>

    <a class="tile" href="/timer">
      <div class="icon-box">
        <svg viewBox="0 0 64 64" fill="none">
          <circle cx="32" cy="35" r="19" stroke="#000000" stroke-width="6"/>
          <path d="M27 6 h10 M32 6 v8" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
          <path d="M28 27 l16 8-16 8z" fill="#ecab0f"/>
        </svg>
      </div>
      <span class="label">Timer</span>
    </a>

    <a class="tile" href="/report">
      <div class="icon-box">
        <svg viewBox="0 0 64 64" fill="none">
          <path d="M20 44 v-14 M32 44 v-24 M44 44 v-8" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
          <path d="M20 44 h24" stroke="#ecab0f" stroke-width="6" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="label">Report</span>
    </a>

    <a class="tile" href="/hours">
      <div class="icon-box">
        <svg viewBox="0 0 64 64" fill="none">
          <path d="M32 12 v20 M22 22 h20" stroke="#ecab0f" stroke-width="6" stroke-linecap="round"/>
          <path d="M22 46 h20" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="label">Hours</span>
    </a>
  </div>
</main>
<script>
  const restartLink = document.getElementById("restart-link");
  restartLink.addEventListener("click", async () => {
    restartLink.textContent = "- redémarrage...";
    restartLink.style.pointerEvents = "none";
    try {
      await fetch("/api/server/restart", { method: "POST" });
    } catch (err) {
      // Normal : le serveur coupe la connexion en cours de redémarrage.
    }
    const waitAndReload = async () => {
      for (let i = 0; i < 40; i++) {
        await new Promise((r) => setTimeout(r, 250));
        try {
          const res = await fetch("/", { cache: "no-store" });
          if (res.ok) {
            location.reload();
            return;
          }
        } catch (err) {
          // Pas encore remonté, on retente.
        }
      }
      restartLink.textContent = "- redémarrer (échec, réessaie)";
      restartLink.style.pointerEvents = "auto";
    };
    waitAndReload();
  });
</script>
</body>
</html>
